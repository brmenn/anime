<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suki</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-size='34' font-family='Segoe UI' font-weight='700' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="bg-layer">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
    <div class="bg-grid"></div>

    <header class="header">
      <a class="brand" href="#/home">
        <span class="brand-mark">S</span>
        <span>Suki</span>
      </a>

      <nav class="nav" id="nav">
        <a href="#/home" data-route="#/home">Beranda</a>
        <a href="#/ongoing" data-route="#/ongoing">On-Going</a>
        <a href="#/completed" data-route="#/completed">Selesai</a>
        <a href="#/genres" data-route="#/genres">Genre</a>
        <a href="#/schedule" data-route="#/schedule">Jadwal</a>
      </nav>

      <form class="search" id="search-form" autocomplete="off">
        <span class="icon">&#9906;</span>
        <input
          type="search"
          id="search-input"
          placeholder="Cari anime..."
          aria-label="Cari anime"
        />
      </form>

      <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
    </header>

    <main class="container" id="app">
      <div class="center-loader">
        <div class="spinner"></div>
      </div>
    </main>

    <footer class="container" style="padding-top: 0">
      <div class="footer">
        <span>Suki</span>
        <span class="muted">
          Data dari API <span id="api-base"></span>
        </span>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
